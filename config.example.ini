; ตัวอย่างการตั้งค่า — คัดลอกเป็น config.ini แล้วแก้ค่าให้ตรงกับสาขา
; ปกติไม่ต้องแก้ไฟล์นี้เอง ใช้ install\bootstrap.bat ตั้งค่าผ่านเมนูได้

[branch]
; ค่าที่ส่งขึ้นคอลัมน์ branch — ต้องตรงกับที่ระบบ HR ใช้
code         = Store 1
; รหัสเครื่อง ไว้ไล่ที่มาของข้อมูลตอนมีปัญหา
machine_code = FP-01

[source]
; อ่านข้อมูลสแกนจากทางไหน
;   device  = ต่อเครื่อง ZKTeco ตรง ๆ (ค่าปกติ)
;   biotime = อ่านจากฐานข้อมูลของ ZKBioTime ในเครื่องนี้
;             ใช้กับสาขาที่ลง ZKBioTime ไว้ เพราะโปรแกรมนั้นยึดการเชื่อมต่อกับเครื่องสแกนไว้
;             ทำให้ต่อตรงไม่ได้ — ตั้งค่าที่ใช้จริงอยู่ในหมวด [biotime] ด้านล่าง
type = device

[device]
; เครื่องสแกนลายนิ้วมือ ZKTeco ในวง LAN ของสาขา (ใช้เมื่อ [source] type = device)
ip             = 192.168.88.175
port           = 4370
timeout_ms     = 10000
udp_local_port = 4000

[biotime]
; ฐานข้อมูล PostgreSQL ของ ZKBioTime ในเครื่องนี้ (ใช้เมื่อ [source] type = biotime)
; ปกติต่อได้โดยไม่ต้องใส่รหัสผ่าน ถ้าเครื่องไหนตั้งไว้ต่างไป ให้ใส่ BIOTIME_PASSWORD ใน .env
psql_path  = C:\ZKBioTime\pgsql\bin\psql.exe
host       = 127.0.0.1
port       = 7496
database   = biotime
user       = postgres
timeout_ms = 30000

[sync]
; ความถี่ในการส่งข้อมูล (นาที)
interval_minutes = 5
; ไม่ส่งข้อมูลที่สแกนก่อนวันนี้ — ตั้งตอนติดตั้งครั้งแรก
start_date       = 2026-01-01
; จำนวนแถวต่อการส่ง 1 ครั้ง
batch_size       = 500

[log]
; ลบไฟล์ log ที่เก่ากว่านี้อัตโนมัติ
keep_days = 30
