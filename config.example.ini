; ตัวอย่างการตั้งค่า — คัดลอกเป็น config.ini แล้วแก้ค่าให้ตรงกับสาขา
; ปกติไม่ต้องแก้ไฟล์นี้เอง ใช้ install\bootstrap.bat ตั้งค่าผ่านเมนูได้

[branch]
; ค่าที่ส่งขึ้นคอลัมน์ branch — ต้องตรงกับที่ระบบ HR ใช้
code         = Store 1
; รหัสเครื่อง ไว้ไล่ที่มาของข้อมูลตอนมีปัญหา
machine_code = FP-01

[device]
; เครื่องสแกนลายนิ้วมือ ZKTeco ในวง LAN ของสาขา
ip             = 192.168.88.175
port           = 4370
timeout_ms     = 10000
udp_local_port = 4000

[sync]
; ความถี่ในการส่งข้อมูล (นาที)
interval_minutes = 5
; ไม่ส่งข้อมูลที่สแกนก่อนวันนี้ — ตั้งตอนติดตั้งครั้งแรก
start_date       = 2026-01-01
; จำนวนแถวต่อการส่ง 1 ครั้ง
batch_size       = 500

[log]
; ลบไฟล์ log ที่เก่ากว่านี้อัตโนมัติ
keep_days = 30
